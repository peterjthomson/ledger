appId: com.peterjthomson.ledger
productName: Ledger
directories:
  buildResources: resources/build
# Remove unused locale files after packaging (~40MB savings)
afterPack: ./scripts/build/afterPack.js
files:
  # Include only the compiled output and essential resources
  - out/**/*
  - resources/build/**/*
  - resources/themes/**/*
  - package.json
  # Explicitly exclude unused icons
  - '!resources/icons{,/**/*}'
  # Exclude everything else explicitly
  - '!**/.vscode/*'
  - '!**/.cursor/*'
  - '!**/.claude/*'
  - '!app{,/**/*}'
  - '!lib{,/**/*}'
  - '!src{,/**/*}'
  - '!wip{,/**/*}'
  - '!dist{,/**/*}'
  - '!docs{,/**/*}'
  - '!tests{,/**/*}'
  - '!test-results{,/**/*}'
  - '!scripts{,/**/*}'
  # Note: node_modules MUST be included for native modules (better-sqlite3) and external deps
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,.prettierrc,dev-app-update.yml}'
  - '!{CHANGELOG.md,README.md,AGENTS.md,CLAUDE.md,CONTRIBUTING.md,LICENSE}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,package-lock.json}'
  - '!tsconfig*.json'
  - '!{components.json,playwright.config.ts,eslint.config.mjs}'
asarUnpack:
  - resources/build/**
extraResources:
  - from: resources/themes
    to: themes
  - from: resources/scripts
    to: scripts
  # Note: resources/icons/ is intentionally excluded (unused)
win:
  executableName: Ledger
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  # Code sign with Developer ID Application certificate
  identity: "Peter Thomson (R4RRG93J68)"
  hardenedRuntime: true
  # Build for Apple Silicon (arm64), Intel (x64), or both (universal)
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64        # Apple Silicon only (smaller, faster)
        # - x64        # Intel only
        # - universal  # Both (larger file ~2x size)
  category: public.app-category.developer-tools
  entitlements: resources/build/entitlements.mac.plist
  entitlementsInherit: resources/build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Ledger needs access to read git repositories.
    - NSDownloadsFolderUsageDescription: Ledger needs access to read git repositories.
    - ITSAppUsesNonExemptEncryption: false
  # Release notarization is submitted separately; see RELEASE-PROTOCOL.md.
  notarize: false
mas:
  identity: "Peter Thomson (R4RRG93J68)"
  hardenedRuntime: true
  category: public.app-category.developer-tools
  entitlements: resources/build/entitlements.mas.plist
  entitlementsInherit: resources/build/entitlements.mas.inherit.plist
  artifactName: ${productName}-${version}-${arch}-mas.${ext}
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  title: ${productName}
  # electron-builder only notarizes the .app; the DMG wrapping it is left
  # unsigned by default, and Gatekeeper cannot assess an unsigned disk image
  # even when it carries a stapled ticket. Sign it, then notarize + staple the
  # DMG itself via scripts/release/notarize.sh.
  sign: true
linux:
  target:
    - AppImage
    - deb
  maintainer: peterjthomson
  category: Development
appImage:
  # ${arch} is mandatory: without it every arch resolves to the same filename and
  # the second AppImage build silently overwrites the first, leaving one binary
  # that both latest-linux.yml and latest-linux-arm64.yml point at with different
  # checksums. Ledger 1.5.0 shipped an aarch64 AppImage named ledger-1.5.0.AppImage
  # to x64 users this way.
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
publish:
  # Upload manually after notarization and local verification are complete.
  provider: github
  owner: peterjthomson
  repo: ledger
